refund:
  max-refund-paise: 5000000          # the record has the same defaults; listing them documents the knobs ops may change per environment
  auto-approve-up-to-paise: 100000
spring:
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 50            # without a cap ?size=100000 loads the whole table into memory (Spring's own cap is 2000)
  jpa:
    open-in-view: false              # the connection returns to the pool when the service method ends; lazy loading in the view fails fast
    hibernate:
      ddl-auto: validate             # production: Flyway/Liquibase own the schema
  mvc:
    problemdetails:
      enabled: true                  # missing header/parameter, malformed JSON, 405 and type mismatches become application/problem+json
server:
  error:
    include-message: never
    include-stacktrace: never
